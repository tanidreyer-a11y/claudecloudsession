# Cross-reference rules (checked in both directions by scripts/recipe.py)
  - id: pile-up
    name: "The pile-up — the viewer's real workload rains down into a messy heap under one short line of type"
    from: [signature-vivid, film:avant-ahead]
    how: "Cards carry real-looking artefacts (INV-1042 · R8,450 overdue). Two typographic beats max."
  - id: one-dot-to-field
    name: "One dot → a field of dots (one customer becomes thousands)"
    from: [frost-trust, enterprise-grid]
    how: "Start on a single dot held 1 s; multiply outward on a Poisson layout over 3 s. Only when the client has the scale to claim it."
  - id: grey-feed-scroll
    name: "Open on a grey endless feed; one post types the hook line; then the rush"
    from: [brand-board-collage, film:klick-kulture]
    how: "Close on the hero post (plane ×1.9) for the hook, pull back as the scroll accelerates — the owner's favourite opening."
  - id: typed-caret-word
    name: "A caret types one big word, then the line under it"
    from: [obsidian-precision, film:obsidian-scratch]
    how: "Inter 500 230 px + 150 px grey-gradient second line, left-aligned; caret solid while typing, blinks when idle; no search bar or prompt UI."
