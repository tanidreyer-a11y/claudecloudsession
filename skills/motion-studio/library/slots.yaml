  - [motion_feel:soft-no-overshoot, pacing:short-punch]
  - [sound:punchy-electronic, pacing:cinematic-2-3]
  - [sound:punchy-electronic, pacing:one-take]
  - [sound:ambient-electronic, pacing:upbeat-1-1.5]
  - [transitions:beat-cut, pacing:one-take]
  - [transitions:beat-cut, pacing:cinematic-2-3]
