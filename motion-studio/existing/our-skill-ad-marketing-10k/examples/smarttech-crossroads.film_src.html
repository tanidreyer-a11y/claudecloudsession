<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SmartTech NXT — Crossroads</title>
<style>
@font-face{font-family:Roboto;font-weight:100;src:url(node_modules/@fontsource/roboto/files/roboto-latin-100-normal.woff2)}
@font-face{font-family:Roboto;font-weight:300;src:url(node_modules/@fontsource/roboto/files/roboto-latin-300-normal.woff2)}
@font-face{font-family:Roboto;font-weight:400;src:url(node_modules/@fontsource/roboto/files/roboto-latin-400-normal.woff2)}
@font-face{font-family:Roboto;font-weight:500;src:url(node_modules/@fontsource/roboto/files/roboto-latin-500-normal.woff2)}
/* ===== SmartTech NXT brand bible 2021 ===== */
:root{ --navy:#002548; --navy-d:#00172E; --navy-l:#0B3A66; --lime:#B5D334; --white:#FFFFFF;
  --ink2:rgba(255,255,255,.62); --ink3:rgba(255,255,255,.34); --glass:rgba(255,255,255,.055); --stroke:rgba(255,255,255,.14); --err:#FF6B5E }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Roboto,sans-serif;color:#fff;
  background:var(--navy)}
#tex{position:absolute;left:-10%;top:-10%;width:120%;height:120%;background:url(../brand/img_p6_0.png) center/cover;opacity:.5}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#world > *{position:absolute}
.c{transform:translate(-50%,-50%)}
.win{width:420px;border-radius:16px;background:rgba(8,40,74,.78);border:1px solid var(--stroke);box-shadow:0 30px 80px rgba(0,8,20,.45);overflow:hidden}
.win .tb{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.win .tb b{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22)}
.win .tb span{margin-left:10px;font-size:13px;letter-spacing:.16em;color:var(--ink2)}
.win .bd{padding:18px 20px 22px}
.fld{margin-bottom:12px}
.fld .l{font-size:11px;letter-spacing:.14em;color:var(--ink3);margin-bottom:6px;text-transform:uppercase}
.fld .v{height:34px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:0 12px;display:flex;align-items:center;font-size:16px;font-weight:300;white-space:nowrap;overflow:hidden}
.fld .v.err{border-color:rgba(255,107,94,.6);color:#FFB3AB}
.caret{display:inline-block;width:1.5px;height:18px;background:#fff;margin-left:2px}
.doc{width:400px;border-radius:10px;background:#F2F4F7;color:#0E2235;padding:32px 34px;box-shadow:0 40px 100px rgba(0,8,20,.55)}
.doc h4{font-size:20px;font-weight:500;letter-spacing:.02em}
.doc .m{font-size:12px;letter-spacing:.12em;color:#6C7A89;margin:6px 0 22px}
.doc .r{display:flex;justify-content:space-between;height:40px;align-items:center;border-bottom:1px solid #DDE2E8;font-size:15px}
.doc .r b{font-weight:500}
.doc .bar{height:8px;border-radius:4px;background:#DDE2E8;margin:12px 0}
.bub{padding:20px 30px;border-radius:30px 30px 30px 8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);font-size:34px;font-weight:300;white-space:nowrap;backdrop-filter:blur(6px)}
.bub i{display:block;font-style:normal;font-size:16px;letter-spacing:.14em;color:var(--ink3);margin-bottom:6px;text-transform:uppercase}
.bub.ok{background:rgba(181,211,52,.12);border-color:rgba(181,211,52,.45);border-radius:20px 20px 6px 20px}
.chip{padding:9px 16px;border-radius:9px;background:rgba(181,211,52,.14);border:1px solid rgba(181,211,52,.6);font-size:16px;white-space:nowrap;color:#fff}
.row{font-size:30px;font-weight:300;white-space:nowrap;color:rgba(255,255,255,.85)}
.row span{color:var(--lime);margin-right:26px;font-weight:400;letter-spacing:.04em}
.person{width:44px;height:58px}
.ldot{width:22px;height:22px;border-radius:50%;background:var(--lime);box-shadow:0 0 22px 5px rgba(181,211,52,.5)}
.cap{position:absolute;left:160px;top:880px;font-size:30px;font-weight:300;letter-spacing:.34em;text-transform:uppercase;white-space:nowrap}
.cap b{color:var(--lime);font-weight:400}
#flash{position:absolute;inset:0;background:var(--lime);opacity:0;pointer-events:none}
#grain{position:absolute;inset:0;opacity:.06;pointer-events:none;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 75% at 50% 50%,transparent 45%,rgba(0,12,26,.9) 100%)}
.letter{fill:#fff}.antenna{fill:var(--lime)}.nxt{fill:var(--lime)}#dot{fill:#fff}
</style>
</head>
<body>
<div id="stage">
  <div id="tex"></div>
  <div id="world"></div>
  <div id="screen" style="position:absolute;inset:0"></div>
  <div id="flash"></div>
  <svg id="grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div id="vig"></div>
</div>
<template id="wordmark">{{WORDMARK}}</template>
<template id="avatar">{{AVATAR}}</template>
<script src="timing.js"></script>
<script src="film.js"></script>
</body>
</html>
