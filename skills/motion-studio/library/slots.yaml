  - id: broken-metric
    name: "One metric visibly breaking"
    from: [paper-lab]
  - id: particle-rain
    name: "Abstract particles that become the stage"
    from: [midnight-signal]
  - id: giant-promise-word
    name: "One giant promise word"
    from: [cobalt-campaign, deep-glass]
  - id: rolling-slot
    name: "Headline with one rolling word slot"
