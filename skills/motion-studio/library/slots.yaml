  - id: sensory-macro
    name: "Sensory macro shot (crust cracking, perfume mist, chalk dust)"
    from: [new]
    needs: [imagery]
    axes: {realism: [4, 5]}
  - id: place-reveal
    name: "The place through a lens"
    from: [desert-glass]
