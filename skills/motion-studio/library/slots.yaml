# Motion Studio slot library: the cross-referenced, recombinable parts of every Style Card.
# A recipe = one option per slot (transitions: 3–4 options). scripts/recipe.py reads this file.
#
# Each option:
#   id        stable id (used in history/projects.json; never rename, add new ids instead)
#   name      human label shown to the client
#   from      where it was observed or proven: style card ids, approved films ("film:adc", "film:smarttech, crossroads"),
#             or shot cards ("shot:<folder>/<name>" -> library/shots/<folder>/<name>.md, Apache-2.0)
#   axes      allowed range per vibe axis [min,max] (1–5). Missing axis = any.
#   needs     optional: imagery (photos/footage needed -> imagery.md), voice, ui (product screens needed)
#   clashes   ids it must never be combined with (checked in both directions)
#   how       one-line build note
#
# Vibe axes: energy (calm→hype) · warmth (cool/technical→warm/human) · density (sparse→packed)
#            realism (abstract→photographic) · polish (raw/handmade→luxury)

structure:
  - id: pain-turn-proof
    name: "Pain → Turn → Proof → Trust → CTA"
    from: [film:adc, film:smarttech, crossroads, midnight-signal]
    how: "0–30 % pain with concrete artefacts, turn at 30–40 %, proof to 75 %, trust, one CTA. The proven default for B2B."
  - id: metric-repair-loop
    name: "Broken metric → diagnose → control → repaired metric (loops to start)"
    from: [paper-lab]
    axes: {energy: [1, 3]}
    how: "Open on one KPI curve dipping; end on the same curve recovered. Needs one honest metric the client can stand behind."
  - id: prompt-result-loops
    name: "Promise → three prompt→result loops → system → brand"
    from: [cobalt-campaign, lavender-desk]
    needs: [ui]
    how: "Each loop 6–10 s: type (2 s) → think (1 s) → result (3–4 s) → hand-off. Three loops, each a different output."
  - id: verb-spine
    name: "Verb spine (Analyze · Research · Review · Deliver) — one chapter per verb"
    from: [lavender-desk]
    axes: {energy: [1, 3]}
    how: "A vertical list on one side is the table of contents; the active verb highlights as its chapter plays."
  - id: one-to-many
    name: "One input → many outputs cascade"
    from: [cream-cascade]
    how: "A single source multiplies (languages, sizes, branches, menu items, listings). Ends on the control dials."
  - id: place-tour
    name: "Sense of place → product tour in one frame → horizon close"
    from: [desert-glass]
    needs: [imagery]
    how: "Open on the location, tour inside one persistent window, close on the same location at a later light."
  - id: hype-statements
    name: "Statement → statement → proof wall → CTA (music-led)"
    from: [kinetic-pop]
    axes: {energy: [4, 5]}
    how: "Big single statements on the beat, a proof section that rains elements, a clicked CTA."
  - id: launch-teaser
    name: "Launch teaser — product chip → typed promise → word-swap claims → \"Available now\""
    from: [sunset-prompt, deep-glass]
    axes: {energy: [3, 5]}
    how: "10–20 s. One promise, two claims, one capability, one pill CTA."
  - id: day-in-the-life
    name: "A day in the life — morning problem → midday turn → evening calm"
    from: [film:adc, desert-glass]
    how: "Time of day carries the arc (light and colour shift); good for local businesses and services."
  - id: logo-anatomy
    name: "Logo anatomy — the logo's parts are the cast, assembled at the end"
    from: [film:smarttech, crossroads]
    how: "Read the brand bible's logo story; each part plays a role; the logo assembles from them as the payoff."
  - id: craft-reveal
    name: "Craft reveal — raw material → process → finished product → people enjoying it"
    from: [cobalt-campaign, cream-cascade]
    needs: [imagery]
    axes: {realism: [3, 5]}
    how: "For makers (bakery, perfume, fashion, furniture). Macro details first, wide reveal last."
  - id: pile-slice-climb
    name: "Pile-up → one line slices it into order → climb the brand mark to the decision → dive through → proof → resolve"
    from: [signature-vivid, film:avant-ahead]
    how: "The mess is shown as real artefacts (invoices, leads) raining into a heap; the turn is ONE line from the brand colour; the climb uses the logo's own geometry; the peak is the client's promise in 3 words."
  - id: world-to-city
    name: "World → country → city: a globe of dots turns to the client's region, messages arc between real towns, dive into one"
    from: [signature-vivid, enterprise-grid, film:avant-every-city]
    how: "Local proof for SA businesses. Real place names only; the numbers on screen must be the client's or marked illustrative."
  - id: single-line-day
    name: "One line carries the whole film: words ride it, a flip to paper shows before/after, it splits into lanes and reconverges"
    from: [signature-vivid, enterprise-grid, film:avant-one-line]
    axes: {density: [1, 3]}
    how: "25 s. Line → words swap on it (4 beats) → slit-flip to white bracket chart → flip back → 4 lanes → one light → logo."

pacing:
  - id: cinematic-2-3
    name: "Cinematic — new beat every 2–3 s, 0–2 hard cuts"
    from: [midnight-signal, paper-lab, film:adc]
    axes: {energy: [1, 3]}
  - id: measured-1.5-2
    name: "Measured — new beat every 1.5–2 s, in-camera scene changes"
    from: [cobalt-campaign, lavender-desk, desert-glass]
    axes: {energy: [2, 4]}
  - id: upbeat-1-1.5
    name: "Upbeat — beat every 1–1.5 s, cuts on the downbeat"
    from: [kinetic-pop, film:smarttech, crossroads]
    axes: {energy: [3, 5]}
  - id: short-punch
    name: "Short punch — 10–20 s, 0.4 cuts/s, sparse sound"
    from: [sunset-prompt, deep-glass]
    axes: {energy: [3, 5]}
  - id: one-take
    name: "One take — zero hard cuts, one continuous camera journey"
    from: [midnight-signal, paper-lab, cream-cascade]
    axes: {energy: [1, 3]}

camera:
  - id: spline-zoom-through
    name: "Spline camera with zoom-throughs (dive into a dot, emerge in the next scene)"
    from: [film:adc, film:smarttech, crossroads, midnight-signal, shot:transition/transition-hidden-cut]
    how: "Monotone cubic spline, log-space zoom, 60→30 fps blend. The house signature — limit to brands that want it."
  - id: vertical-travel
    name: "Vertical travel — falls, drops and rises following one object"
    from: [midnight-signal, cream-cascade, shot:camera/steep-tilt-glide]
  - id: lateral-hairline
    name: "Lateral drift following a drawn hairline"
    from: [paper-lab, shot:transition/line-carry-transition]
    axes: {energy: [1, 3]}
  - id: tilted-planes
    name: "Tilted 3D planes (15–25° Y), push to prompt, pull back to grids"
    from: [cobalt-campaign, desert-glass, shot:camera/depth-layer-moves]
  - id: oversize-skim
    name: "Oversized UI skim — camera closer than the screen, shallow focus"
    from: [deep-glass, shot:camera/cursor-flyover]
    needs: [ui]
  - id: locked-type
    name: "Locked frame — motion lives in type and elements"
    from: [kinetic-pop, sunset-prompt, lavender-desk]
  - id: answer-zoom
    name: "Zoom into the content until body text becomes the headline"
    from: [sunset-prompt, shot:camera/crash-zoom-punch]
    axes: {energy: [3, 5]}
  - id: parallax-landscape
    name: "Slow dolly + parallax over a photographic backdrop"
    from: [desert-glass]
    needs: [imagery]
    axes: {energy: [1, 3], realism: [4, 5]}
  - id: orbit-carousel
    name: "Curved 3D carousel orbit"
    from: [deep-glass, shot:ui-entrance/carousel-3d]
  - id: isometric
    name: "Isometric system view (slabs, docks, trees)"
    from: [cobalt-campaign, shot:camera/overhead-camera-moves]
  - id: macro-to-wide
    name: "Macro detail → wide reveal (photographic)"
    from: [shot:opening/crane-rise-reveal]
    needs: [imagery]
    axes: {realism: [3, 5]}
  - id: climb-the-mark
    name: "Climb the brand mark — the camera rises with a light along the logo's own strokes"
    from: [signature-vivid, film:avant-ahead]
    how: "Build the logo huge in world space (e.g. a Λ 2500 px tall), let a light climb one stroke lighting agents/steps, peak = the promise, descend the other stroke with results."

transitions:   # a recipe takes 3–4, one "signature" + 2–3 supporting
  - id: zoom-through
    name: "Zoom-through iris (hidden cut)"
    from: [film:adc, film:smarttech, crossroads, shot:transition/transition-hidden-cut]
  - id: object-becomes-object
    name: "Object becomes object (chips → ball, line → logo bar)"
    from: [film:adc, film:smarttech, crossroads, midnight-signal]
  - id: line-led
    name: "Line draws and branches; camera follows the tip"
    from: [paper-lab, midnight-signal, cream-cascade, shot:transition/line-carry-transition]
  - id: circle-match
    name: "Circle match iris (avatar circle becomes a chart ring)"
    from: [paper-lab, shot:transition/circle-match-iris]
  - id: fog-wash
    name: "Background wash changes colour/family between chapters"
    from: [paper-lab, lavender-desk, cobalt-campaign, shot:transition/gradient-transition]
  - id: send-is-the-cut
    name: "Prompt \"send\" button is the cut to the result"
    from: [cobalt-campaign, lavender-desk, sunset-prompt]
    needs: [ui]
  - id: giant-word-pass
    name: "Camera passes through a giant word"
    from: [cobalt-campaign, deep-glass, shot:typography/flying-words]
  - id: tilt-swap
    name: "Tilt away / tilt in of planes"
    from: [cobalt-campaign, desert-glass]
  - id: duplicate-cascade
    name: "Duplicate-and-offset cascade"
    from: [cream-cascade, shot:ui-entrance/card-stack]
  - id: beat-cut
    name: "Hard cut on the downbeat"
    from: [kinetic-pop, deep-glass, sunset-prompt, shot:rhythm/beat-cut-moves]
    axes: {energy: [3, 5]}
  - id: word-roll
    name: "Vertical word roll / slot-machine swap"
    from: [kinetic-pop, sunset-prompt, shot:typography/vertical-word-roll-blur-cycle]
    axes: {energy: [3, 5]}
  - id: colour-block-wipe
    name: "Colour-block step wipe"
    from: [kinetic-pop, shot:transition/color-block-step-wipe]
    axes: {energy: [3, 5], polish: [2, 4]}
  - id: lens-reveal
    name: "Glass lens / rack-focus reveal"
    from: [desert-glass, midnight-signal]
  - id: card-flip
    name: "Card flip reveal"
    from: [shot:transition/card-flip-reveal]
  - id: page-turn
    name: "Page turn / paper transitions"
    from: [shot:transition/page-turn-transitions, shot:transition/print-texture-transitions]
    axes: {warmth: [3, 5], polish: [2, 4]}
  - id: freeze-hook
    name: "Freeze and slow to 5 % on the hook word"
    from: [film:adc]
  - id: ui-to-brand
    name: "UI strips away into the logo"
    from: [shot:outro/ui-to-brand-morph, shot:outro/ui-strip-away-outro]
  - id: photo-cross-dissolve
    name: "Light-matched photographic cross-dissolve"
    from: [desert-glass]
    needs: [imagery]
    axes: {energy: [1, 3]}
  - id: shape-aperture-dive
    name: "Aperture dive — the next world opens through a shape taken from the logo (triangle, ring, bar), not a generic circle"
    from: [signature-vivid, midnight-signal, film:avant-ahead]
    how: "Zoom ×14 around the shape's apex while a clipPath of that shape grows from it. The single most 'ours' transition."
  - id: slit-flip
    name: "Slit flip — the frame opens from a single line into the opposite world (dark ↔ paper)"
    from: [enterprise-grid, signature-vivid, film:avant-one-line]
    how: "inset() clip from the line's y outward over 0.9 s, and back the same way. Works best when the line has been the hero."
  - id: lanes-converge
    name: "Lanes converge — parallel coloured lanes bend into one point of light"
    from: [signature-vivid, film:avant-one-line]
    how: "Each lane = one agent/service with a live counter; the bend is a cubic; the merged light becomes the logo."
  - id: slice-to-strip
    name: "Slice to strip — wide panels slice into narrow strips that stream across like progress"
    from: [frost-trust]
    how: "3 panels → 24 strips (stagger 20 ms) → a moving band; use for 'processing / at scale'."

typography:    # fonts are OFL / free unless the brand supplies its own licensed font
  - id: geometric-light
    name: "Light geometric grotesk, text drifts through focus"
    from: [midnight-signal]
    fonts: [Inter (OFL), Manrope (OFL)]
    axes: {energy: [1, 3]}
  - id: tiny-precise
    name: "Tiny precise labels — the diagrams are the headline"
    from: [paper-lab]
    fonts: [Inter (OFL), IBM Plex Sans (OFL)]
    axes: {density: [1, 3]}
  - id: giant-glass-word
    name: "One giant extra-bold word behind glass"
    from: [deep-glass]
    fonts: [Plus Jakarta Sans (OFL), Inter Display (OFL)]
  - id: gradient-chapter-words
    name: "Huge light-weight gradient chapter words"
    from: [cobalt-campaign, shot:typography/gradient-word-sweep]
    fonts: [Montserrat (OFL), Manrope (OFL)]
  - id: heavy-rounded
    name: "Heavy rounded statements filling the width"
    from: [kinetic-pop]
    fonts: [Poppins (OFL), Nunito (OFL)]
    axes: {energy: [3, 5]}
  - id: word-swap-colour
    name: "Two-word claim, second word swaps and changes colour"
    from: [sunset-prompt, shot:typography/pill-slot-cycle]
    fonts: [Inter (OFL), DM Sans (OFL)]
  - id: serif-greeting
    name: "Serif display (gradient) + clean grotesk UI"
    from: [lavender-desk]
    fonts: [Fraunces (OFL), Newsreader (OFL), Inter (OFL)]
    axes: {polish: [3, 5]}
  - id: editorial-serif
    name: "Editorial serif headlines, wide tracking caps labels"
    from: [cream-cascade, desert-glass]
    fonts: [Playfair Display (OFL), Cormorant (OFL), Bodoni Moda (OFL)]
    axes: {warmth: [3, 5], polish: [3, 5]}
  - id: verb-list
    name: "Vertical list with active-item emphasis"
    from: [lavender-desk, shot:rhythm/beat-step-list-theme-cycle]
  - id: typewriter-doc
    name: "Typed prompts and document typewriter reveal"
    from: [cobalt-campaign, lavender-desk, shot:typography/document-typewriter-reveal]
    needs: [ui]
  - id: brand-font
    name: "The brand's own font (from the brand bible) with its web fallback"
    from: [film:smarttech, crossroads]
    how: "Only when the client supplies or licenses it; otherwise pick an OFL match."
  - id: line-riding-swap
    name: "Words ride a hairline — each word slides up out of the line mask and out again"
    from: [enterprise-grid, signature-vivid]
    how: "Mask = 140 px band above the line; 1.2 s per word; the last word holds. One word or short phrase at a time."

colour:        # palette FAMILIES; the brand's tokens are mapped onto the family's roles
  - id: midnight
    name: "Near-black + cool steel + one soft glow per role"
    from: [midnight-signal]
    axes: {warmth: [1, 3]}
  - id: navy-glass
    name: "Deep navy + royal blue glass + ice edges"
    from: [deep-glass, film:smarttech, crossroads]
    axes: {warmth: [1, 2]}
  - id: cobalt-light-dark
    name: "Cobalt/indigo darks alternating with ice-blue lights; photos keep their warmth"
    from: [cobalt-campaign]
  - id: paper-sage
    name: "Paper white + cool grey + sage fog + iridescent orbs"
    from: [paper-lab]
    axes: {energy: [1, 3]}
  - id: pastel-wash
    name: "Lavender / mint / cream washes per chapter + one violet accent"
    from: [lavender-desk]
  - id: cream-terracotta
    name: "Cream + espresso + peach + terracotta"
    from: [cream-cascade]
    axes: {warmth: [3, 5]}
  - id: golden-dusk
    name: "Golden hour → dusk: rose, sand, coral, rust, dusk blue"
    from: [desert-glass]
    axes: {warmth: [4, 5]}
  - id: sunset-gradient
    name: "White + full-bleed coral→periwinkle→peach gradients"
    from: [sunset-prompt]
    axes: {energy: [3, 5]}
  - id: mono-flip-gradient
    name: "Paper ↔ charcoal flips + one loud gradient for hero frames"
    from: [kinetic-pop]
    axes: {energy: [3, 5]}
  - id: brand-tokens
    name: "Strictly the brand bible's palette (accent ≤ 5 % of frame)"
    from: [film:smarttech, crossroads, film:adc]
  - id: vivid-on-black
    name: "Vivid on black — lilac #B9A6FF, pink #FF9FCB, cyan #5FD6FF, blue #5B83FF, orange #FF8A3C, violet #A274FF, green #3FE6A6 on #07080B, plus ONE full-bleed lilac/cyan/pink/navy gradient world"
    from: [signature-vivid, midnight-signal]
    how: "The client's accent replaces one hue; never mid-grey. The gradient world appears once (the 'inside')."

ui_treatment:
  - id: floating-chat
    name: "Stylised chat bubbles and glass tiles in space, no device frames"
    from: [midnight-signal]
  - id: hairline-cards
    name: "White hairline cards, pill toggles, thin vector charts"
    from: [paper-lab]
  - id: frosted-glass
    name: "Frosted glass panels, inner highlight, 1 px light edge"
    from: [deep-glass, desert-glass]
  - id: prompt-bar-results
    name: "Glass prompt bar + result cards, tables, trend chips, file chips"
    from: [cobalt-campaign, lavender-desk, sunset-prompt]
    needs: [ui]
  - id: metric-cards
    name: "Tilted metric cards with growth chips, avatars, star cards"
    from: [kinetic-pop]
    needs: [ui]
    axes: {energy: [3, 5]}
  - id: flow-nodes
    name: "Nodes and gradient tiles joined by elbow lines"
    from: [cream-cascade, shot:ui-entrance/integration-hub-map]
  - id: real-app-window
    name: "One persistent realistic app window, content swaps inside"
    from: [desert-glass, lavender-desk]
    needs: [ui]
  - id: photo-cards
    name: "Photographic creatives on cards (ads, products, listings, dishes)"
    from: [cobalt-campaign, cream-cascade]
    needs: [imagery]
  - id: no-ui
    name: "No UI — product, place and people only (non-software businesses)"
    from: [desert-glass]
    needs: [imagery]
  - id: geometry-only
    name: "Pure geometry — lines, dots, rings, grids (no UI, no photos)"
    from: [film:adc, film:smarttech, crossroads, paper-lab]
  - id: approve-draft
    name: "Draft → Approve — an AI reply waits as a dashed draft with an Approve button; a thumb taps; it sends"
    from: [signature-vivid, film:avant-ahead]
    how: "For any product where a human signs off. Status line DRAFT · WAITING FOR APPROVAL → SENT · 08:02."
  - id: bracket-chart
    name: "Bracket chart — dotted grid, four bracket corners, two bars (before / after) counting up"
    from: [enterprise-grid, paper-lab, signature-vivid]
    how: "Only honest numbers. Paper (#F3F4F7) world, ink #12151C, the 'after' bar in the brand accent with glow."
  - id: frosted-padlock
    name: "Frosted padlock with compliance words beside it (words, not badges)"
    from: [frost-trust]
    how: "ONLY certifications the client actually holds. Otherwise use 'POPIA-minded'."

motion_feel:
  - id: soft-no-overshoot
    name: "Soft, high damping, long ease-in-out — nothing snaps"
    from: [midnight-signal, paper-lab, desert-glass]
    axes: {energy: [1, 3]}
  - id: smooth-parallax
    name: "Smooth ease-out with layered parallax"
    from: [deep-glass, cobalt-campaign]
  - id: snappy-pop
    name: "Snappy springs with overshoot, 40–80 ms staggers"
    from: [kinetic-pop]
    axes: {energy: [4, 5]}
  - id: crisp-ui
    name: "Crisp 200–300 ms ease-out, human typing cadence"
    from: [sunset-prompt, lavender-desk]
  - id: settle-stack
    name: "Soft drops that settle into stacks, 100–150 ms staggers"
    from: [cream-cascade]

sound:
  - id: ambient-electronic
    name: "Ambient electronic bed ~100–110 bpm, soft ticks, airy swells"
    from: [midnight-signal, film:adc]
    axes: {energy: [1, 3]}
  - id: light-pulse-clicks
    name: "Light pulse ~120–130 bpm, clicky UI ticks, no big hits"
    from: [paper-lab, lavender-desk]
  - id: punchy-electronic
    name: "Punchy electronic with risers into downbeats"
    from: [deep-glass, kinetic-pop]
    axes: {energy: [3, 5]}
  - id: halftime-cinematic
    name: "Cinematic half-time pulse (~75/150 bpm) with a swell per result"
    from: [cobalt-campaign]
  - id: warm-cinematic
    name: "Warm cinematic bed, light percussion, very few SFX"
    from: [desert-glass, cream-cascade]
    axes: {warmth: [3, 5]}
  - id: sparse-minimal
    name: "Sparse — key clicks, one tone per swap, silence as a sound"
    from: [sunset-prompt]
  - id: acoustic-human
    name: "Acoustic/organic (guitar, piano, hand percussion) — royalty-free or licensed"
    from: [new]
    axes: {warmth: [4, 5]}
    how: "For bakeries, cafés, gyms with a community feel. Self-generated synths can't do this well → offer a licensed track (paid add-on)."
  - id: chord-per-world
    name: "A chord per world — every scene/colour world has its own chord; all SFX are notes of it; max 3 air moves"
    from: [signature-vivid, film:avant-ahead, film:avant-one-line, film:avant-every-city]
    how: "Dark pile-up = minor 7; order = major 9; the peak = the V chord bloom; home = the tonic with the logo boom."

