  - id: question-to-viewer
    name: "Direct question to the viewer on screen"
    from: [shot:typography/lead-word-zoom-assemble]
  - id: before-after
    name: "Before/after split or slider"
    from: [shot:data/before-after-slider-scrub]

# Cross-reference rules (checked in both directions by scripts/recipe.py)
  - id: pile-up
    name: "The pile-up — the viewer's real workload rains down into a messy heap under one short line of type"
    from: [signature-vivid, film:avant-ahead]
    how: "Cards carry real-looking artefacts (INV-1042 · R8,450 overdue). Two typographic beats max."
  - id: one-dot-to-field
    name: "One dot → a field of dots (one customer becomes thousands)"
    from: [frost-trust, enterprise-grid]
    how: "Start on a single dot held 1 s; multiply outward on a Poisson layout over 3 s. Only when the client has the scale to claim it."
